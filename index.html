<style>
:root{
  --bg:#EEF1EF; --sheet:#F7F8F7; --card:#FFFFFF; --card-2:#F2F4F3; --ink:#16211B; --muted:#6B7770; --line:#E3E7E4;
  --hero-1:#0E2A1D; --hero-2:#1F4D36; --hero-ink:#F1F6F3; --hero-muted:#A9C2B4;
  --green:#15805A; --green-soft:#DDF1E7; --orange:#E3801B; --orange-soft:#FCEBD8; --red:#D2453F; --red-soft:#F8DEDC;
  --gray-chip:#E4E7E5; --star:#F2B705;
  --font:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --maxw:760px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110E; --sheet:#101814; --card:#16201B; --card-2:#1C2822; --ink:#E6EEEA; --muted:#94A69C; --line:#26332C;
    --hero-1:#06140D; --hero-2:#123524;
    --green:#3CC08A; --green-soft:#153A2A; --orange:#F09A45; --orange-soft:#3A2715; --red:#EE7069; --red-soft:#3B1D1D;
    --gray-chip:#26332C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110E; --sheet:#101814; --card:#16201B; --card-2:#1C2822; --ink:#E6EEEA; --muted:#94A69C; --line:#26332C;
  --hero-1:#06140D; --hero-2:#123524;
  --green:#3CC08A; --green-soft:#153A2A; --orange:#F09A45; --orange-soft:#3A2715; --red:#EE7069; --red-soft:#3B1D1D;
  --gray-chip:#26332C;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.n,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- topo escuro + folha branca (como um app) */
.hero{background:linear-gradient(160deg,var(--hero-1),var(--hero-2));color:var(--hero-ink);padding:calc(env(safe-area-inset-top,0px) + 14px) 0 64px}
.col{max-width:var(--maxw);margin:0 auto;padding-inline:18px}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{font-size:1.15rem;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.back{border:0;background:transparent;color:inherit;display:grid;place-items:center;width:36px;height:36px;margin-left:-8px;border-radius:10px;cursor:pointer}
.back:hover{background:rgba(255,255,255,.08)}
.badge{font-size:.8rem;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.14)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand b{font-weight:700;font-size:1.1rem;letter-spacing:.01em}
.brand small{display:block;color:var(--hero-muted);font-size:.8rem;font-weight:500}
.keypad{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.keypad i{height:13px;border-radius:2px;border:1px solid rgba(255,255,255,.7)}
.keypad i:nth-child(1){background:#fff}
.keypad i:nth-child(2){background:#E8841F;border-color:#E8841F}
.keypad i:nth-child(3){background:#23915A;border-color:#2fb574}
.sheet{background:var(--sheet);border-radius:28px 28px 0 0;margin-top:-40px;min-height:60vh;position:relative}
.sheet > .col{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}

/* ---------- início */
.vcard{margin-top:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:16px 18px}
.vcard .pick-city{position:relative;display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12)}
.vcard .pick-city small{display:block;color:var(--hero-muted);font-size:.85rem}
.vcard .pick-city b{font-size:1.45rem;font-weight:600;letter-spacing:-.01em}
.vcard .pick-city div{flex:1}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:14px}
.shortcuts a{display:grid;justify-items:center;gap:6px;color:var(--hero-ink);text-decoration:none;font-size:.82rem}
.shortcuts a span{width:50px;height:50px;border-radius:14px;background:#fff;color:var(--hero-1);display:grid;place-items:center}
.shortcuts a:hover span{transform:translateY(-1px)}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:1.02rem;padding:4px 2px}

/* ---------- linhas de escolha (selects com cara de lista) */
.row{position:relative;display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;min-height:54px;padding:8px 14px;text-decoration:none;color:inherit}
a.row:hover,.row:has(select:hover){border-color:#C9D1CC}
.row .txt{flex:1;min-width:0}
.row .txt small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.row .txt b{display:block;font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;appearance:none;border:0}
.row .ico{color:var(--muted)}
.row.hl{background:var(--card)}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;vertical-align:1px}
.picks{display:grid;gap:10px}
.picks.two{grid-template-columns:1fr 1fr}

/* ---------- resumo (votantes, válidos...) */
.resumo{display:grid;grid-template-columns:1fr auto auto;gap:1px 18px;font-size:.84rem;color:var(--muted);padding:2px 4px}
.resumo span:nth-child(3n+2),.resumo span:nth-child(3n){text-align:right;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:99px;background:var(--gray-chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .6s}
.live{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem}
.live b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--gray-chip);color:var(--muted)}
.pill.on{background:var(--orange-soft);color:var(--orange)}
.pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.pill.ok{background:var(--green);color:#fff}
@keyframes pulse{50%{opacity:.25}}

/* ---------- busca */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:1rem;min-width:0}
.search .i{color:var(--muted)}

/* ---------- lista de candidatos */
.clist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto 34px;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--line);cursor:pointer}
.clist .crow:first-child{border-top:0}
.crow:hover{background:var(--card-2)}
.rank{font-size:.9rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.av{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:1rem;flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:38px;height:38px;font-size:.8rem}
.av.lg{width:64px;height:64px;font-size:1.2rem}
.who{min-width:0}
.who b{display:block;font-size:.84rem;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.25;overflow-wrap:anywhere}
.who .meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--gray-chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--green);color:#fff}
.chip.go{background:var(--green);color:#fff}
.chip.sup{background:var(--orange-soft);color:var(--orange)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.nums{text-align:right;line-height:1.2}
.nums b{display:block;font-size:1.12rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.nums small{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.delta{color:var(--green);font-weight:600;font-size:.75rem}
.star{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;display:grid;place-items:center}
.star svg{width:24px;height:24px}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:var(--star)}
.more{display:flex;justify-content:center;padding:12px}
.btn{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C9D1CC}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:.93rem}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.55}
.note.warn{background:var(--orange-soft);border-color:transparent}
.note.err{background:var(--red-soft);border-color:transparent}
.note.info{background:var(--green-soft);border-color:transparent}
.note .btn{margin-top:8px}

/* ---------- candidato */
.ecard{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.ecard .txt{flex:1;min-width:0}
.ecard .txt b{font-weight:600;font-size:1.02rem}
.ecard .txt small{display:block;color:var(--muted);font-size:.8rem}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ccard .crow{cursor:default;position:relative}
.ccard .crow select{position:absolute;inset:0 60px 0 0;opacity:0;cursor:pointer}
.ccard .troca{font-size:.75rem;color:var(--green);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.seg{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card-2);color:var(--muted);font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem}
.crumb button{border:0;background:var(--green-soft);color:var(--green);font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
.rlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 64px 16px;align-items:center;gap:10px;padding:11px 12px 11px 10px;border-top:1px solid var(--line);font-size:.9rem}
.rlist .rrow:first-child{border-top:0}
.rrow.go{cursor:pointer}
.rrow.go:hover{background:var(--card-2)}
.rrow .p{color:var(--muted);text-align:right;font-size:.82rem}
.rrow .nm{min-width:0}
.rrow .nm b{display:block;font-weight:600;text-transform:uppercase;font-size:.84rem;overflow-wrap:anywhere}
.rrow .nm small{display:block;color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}
.rrow .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rrow .pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.86rem}
.rrow .ch{color:var(--muted);font-size:1.1rem}
.rrow .won{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:2px}
.map{height:420px;width:100%;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--card-2)}
.legend{font-size:.82rem;color:var(--muted);padding:2px 4px}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.leaflet-container{font:inherit}
.leaflet-tooltip{font:13px/1.4 var(--font)}

/* ---------- comparativo */
.cmp-cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cmp-c{position:relative;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;display:grid;justify-items:center;gap:6px;text-align:center}
.cmp-c select{position:absolute;inset:0;opacity:0;cursor:pointer}
.cmp-c b{font-size:.72rem;font-weight:700;text-transform:uppercase;line-height:1.2;overflow-wrap:anywhere}
.cmp-c .vv{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.cmp-c .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--k)}
.cmp-c.vazio{color:var(--muted);font-size:.8rem;place-content:center}
.ord{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;overflow-x:auto}
.ord > span{font-size:.8rem;font-weight:700;white-space:nowrap}
.ord button{border:0;background:var(--card-2);color:var(--ink);font-size:.8rem;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ord button[aria-pressed="true"]{background:var(--green);color:#fff}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.pcard header{display:flex;align-items:baseline;gap:10px}
.pcard header b{flex:1;font-weight:700;text-transform:uppercase;font-size:.9rem;overflow-wrap:anywhere}
.pcard header small{color:var(--muted);font-size:.84rem;white-space:nowrap}
.pcard header small b{display:inline;color:var(--ink);font-size:.9rem;text-transform:none}
.win{justify-self:start;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:7px;color:#fff;background:var(--k,var(--muted))}
.brow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:.84rem}
.brow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{height:9px;border-radius:99px;background:var(--gray-chip);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:99px;background:var(--k)}
.brow .q{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.brow.top span:first-child{font-weight:700}
.brow em{font-style:normal}
.brow.top span:first-child em{color:var(--k);font-style:normal}

/* ---------- favoritos */
.fav-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.fav-head b{font-size:1.05rem;font-weight:700}
.fav-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.fcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto 34px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;cursor:pointer}
.fcard .who small{display:block;color:var(--muted);font-size:.78rem}
.fcard .fx{display:grid;gap:4px;justify-items:end;min-width:120px}
.fcard .fx b{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.fcard .tr{width:120px;height:7px;border-radius:99px;background:var(--gray-chip);overflow:hidden}
.fcard .tr i{display:block;height:100%;background:var(--green)}
.fcard.no .tr i{background:var(--red)}
.fcard .fx small{color:var(--muted);font-size:.78rem}

/* ---------- ajuda */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.card h3{margin:0;font-size:1.02rem;font-weight:700}
.card p,.card li{margin:0;font-size:.93rem;line-height:1.55}
.card ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
.card table{width:100%;border-collapse:collapse;font-size:.88rem}
.card td,.card th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.card th{font-size:.78rem;color:var(--muted);font-weight:600}
.card td.n,.card th.n{text-align:right}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;font-size:.9rem}
.drop.over{border-color:var(--green);background:var(--green-soft)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
pre{background:var(--card-2);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:0}
details > summary{cursor:pointer;font-weight:600}
details[open] > summary{margin-bottom:10px}
.radios{display:grid;gap:6px;font-size:.9rem}
.radios label{display:flex;gap:8px;align-items:flex-start}
select.plain{height:42px;width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:0 10px}
.foot{font-size:.78rem;color:var(--muted);text-align:center;padding:8px 10px 0;line-height:1.5}

/* ---------- barra de navegação inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--card-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px}
.tabbar a{display:grid;justify-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--green)}
.tabbar a.center{position:relative}
.tabbar a.center span{position:absolute;top:-44px;width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(21,128,90,.35);border:4px solid var(--card-2)}
.tabbar a.center span svg{width:26px;height:26px}
.tabbar a.center em{font-style:normal;margin-top:24px}

@media (max-width:560px){
  .col{padding-inline:14px}
  .crow{grid-template-columns:18px 46px minmax(0,1fr) auto 28px;gap:10px;padding:11px 8px 11px 10px}
  .av{width:46px;height:46px}
  .rrow{grid-template-columns:24px minmax(0,1fr) auto 54px 12px;gap:8px}
  .fcard{grid-template-columns:46px minmax(0,1fr) 28px}
  .fcard .fx{grid-column:2 / 3;justify-items:start;min-width:0}
  .fcard .tr{width:100%}
  .brow{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 48px}
  .picks.two{grid-template-columns:1fr}
  .map{height:320px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============================================================ acesso ao TSE (resultado oficial e apuração ao vivo) */
const BASES = { oficial: 'https://resultados.tse.jus.br/oficial/' };
const CONN = { via: store.get('rv.via', 'auto'), direto: {}, ultimo: '' };
function httpErr(status, p) { const e = new Error(status === 404 ? 'Arquivo ainda não publicado pelo TSE' : 'TSE respondeu ' + status); e.status = status; e.p = p; return e; }
const NOTFOUND = new Map(); // evita repetir 404 (o TSE bloqueia IPs que geram muitos 404)
async function tse(p) {
  const nf = NOTFOUND.get(p);
  if (nf && Date.now() - nf < 60000) throw httpErr(404, p);
  const direto = async () => {
    let r;
    try { r = await fetch(BASES.oficial + p, { cache: 'no-store' }); }
    catch (e) { CONN.direto.oficial = false; throw e; }
    if (r.status === 404) { NOTFOUND.set(p, Date.now()); throw httpErr(404, p); }
    if (!r.ok) throw httpErr(r.status, p);
    const j = await r.json();
    CONN.direto.oficial = true; CONN.ultimo = 'direto';
    return j;
  };
  const proxy = async () => {
    const r = await fetch('api/tse?amb=oficial&p=' + encodeURIComponent(p), { cache: 'no-store' });
    if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('proxy ausente');
    if (r.status === 404) { NOTFOUND.set(p, Date.now()); throw httpErr(404, p); }
    if (!r.ok) throw httpErr(r.status, p);
    CONN.ultimo = 'proxy';
    return await r.json();
  };
  const ordem = CONN.via === 'direto' ? [direto] : CONN.via === 'proxy' ? [proxy] : CONN.direto.oficial === false ? [proxy, direto] : [direto, proxy];
  for (const f of ordem) { try { return await f(); } catch (e) { if (e.status) throw e; } }
  const x = new Error('Não foi possível acessar o TSE agora.');
  x.offline = true;
  throw x;
}
const pad = (n, w) => String(n).padStart(w, '0');
const P = {
  mun: ele => `${ele.ciclo}/${ele.cd}/config/mun-e${pad(ele.cd, 6)}-cm.json`,
  res: (ele, uf, mun, cargo) => `${ele.ciclo}/${ele.cd}/dados/${uf}/${uf}${mun || ''}-c${pad(cargo, 4)}-e${pad(ele.cd, 6)}-u.json`,
  foto: (ciclo, ele, uf, sq) => `${BASES.oficial}${ciclo}/${ele}/fotos/${uf}/${sq}.jpeg`,
};
// Eleições 2026 (códigos de produção do TSE): Presidente numa eleição, cargos estaduais em outra
const ELE26 = { fed: { cd: '6257', ciclo: 'ele2026', t: '1' }, est: { cd: '6259', ciclo: 'ele2026', t: '1' } };
const CARGOS26 = [{ cd: 1, ds: 'Presidente' }, { cd: 3, ds: 'Governador' }, { cd: 5, ds: 'Senador' }, { cd: 6, ds: 'Deputado Federal' }, { cd: 7, ds: 'Deputado Estadual' }, { cd: 8, ds: 'Deputado Distrital' }];
const DIA_2026 = '04/10/2026';

function parseEA20(j) {
  const cg = (j.carg || [])[0] || {};
  const cands = [];
  for (const a of cg.agr || []) for (const p of a.par || []) for (const c of p.cand || []) {
    cands.push({ n: String(c.n), sq: String(c.sqcand), nm: dec(c.nmu || c.nm), sg: dec(p.sg), vap: int(c.vap), pvap: num(c.pvapn ?? c.pvap), seq: int(c.seq) || 9999, e: c.e === 's', st: dec(c.st), dvt: dec(c.dvt) });
  }
  cands.sort((a, b) => b.vap - a.vap || a.seq - b.seq);
  return { cargo: { cd: +cg.cd, nm: dec(cg.nmn || cg.nmm || '') }, cands, s: j.s || {}, e: j.e || {}, v: j.v || {}, meta: { dt: j.dt, ht: j.ht, and: j.and } };
}

/* ============================================================ dados publicados: votos por urna (boletins de urna oficiais) */
const DS = new Map(); // "ano|UF|cd" -> { ano, uf, cd, nm, arquivo, doc }
const CIDADE_PADRAO = '17590'; // Mossoró/RN
async function carregarIndice() {
  try {
    const r = await fetch('data/historico/index.json', { cache: 'no-cache' });
    if (r.ok && (r.headers.get('content-type') || '').includes('json')) {
      const j = await r.json();
      for (const d of j.datasets || []) DS.set(d.ano + '|' + d.uf + '|' + d.cd, { ...d, src: 'data/historico/' + d.arquivo });
      LOC.publicados = j.locais || [];
    }
  } catch {}
}
const anosHist = () => [...new Set([...DS.values()].map(d => +d.ano))].sort((a, b) => b - a);
function cidadesHist(ano) {
  return [...DS.values()].filter(d => +d.ano === +ano).sort((a, b) => a.nm.localeCompare(b.nm));
}
async function getDoc(ano, uf, cd) {
  const d = DS.get(ano + '|' + uf + '|' + cd);
  if (!d) return null;
  if (!d.doc) {
    if (!d._p) d._p = (async () => {
      const r = await fetch(d.src);
      if (!r.ok) throw new Error('Não foi possível ler ' + d.src);
      const doc = prepararDoc(await r.json());
      await aplicarLocais(doc);
      d.doc = doc;
      return doc;
    })();
    return d._p;
  }
  return d.doc;
}
function prepararDoc(doc) {
  if (!doc || doc.versao !== 1 || !Array.isArray(doc.eleicoes)) throw new Error('Arquivo em formato desconhecido.');
  for (const E of doc.eleicoes) {
    const n = E.cand.length, tot = new Float64Array(n);
    for (let i = 0; i < E.v.length; i += 3) tot[E.v[i + 1]] += E.v[i + 2];
    E._tot = tot;
    E._val = E.cand.reduce((s, c, i) => s + ((c.tipo === 'c' && !c.anulado) || c.tipo === 'l' ? tot[i] : 0), 0);
    E._all = tot.reduce((s, x) => s + x, 0);
    E._rank = E.cand.map((c, i) => i).filter(i => E.cand[i].tipo === 'c').sort((a, b) => tot[b] - tot[a]);
  }
  return doc;
}
// Nomes, bairros, endereços e coordenadas dos locais (cadastro do TSE publicado no site ou carregado neste navegador)
const CATALOGOS = new Map();
async function catalogo(uf, ano) {
  const k = uf + '|' + ano;
  if (!CATALOGOS.has(k)) {
    let cat = store.get('rv.locais.' + k, null);
    const pub = LOC.publicados.find(x => x.uf === uf && +x.ano === +ano);
    if ((!cat || !cat.secoes) && pub) { try { const r = await fetch('data/locais/' + pub.arquivo); if (r.ok) { const p = await r.json(); if (!cat || p.secoes) cat = p; } } catch {} }
    CATALOGOS.set(k, cat);
  }
  return CATALOGOS.get(k);
}
async function aplicarLocais(doc) {
  const cat = await catalogo(doc.uf, doc.ano);
  const cd = doc.municipio.cd;
  if (cat?.locais) {
    // seções que o boletim registra num local e o cadastro em outro (ex.: escola em reforma)
    if (cat.secoes) {
      const idx = new Map(doc.locais.map((L, i) => [L.z + '|' + L.n, i]));
      for (const s of doc.secoes) {
        const L = doc.locais[s[0]];
        if (cat.locais[`${cd}|${L.z}|${L.n}`]) continue;
        const n2 = cat.secoes[`${cd}|${s[1]}|${s[2]}`];
        if (n2 == null) continue;
        let i = idx.get(L.z + '|' + n2);
        if (i == null) { i = doc.locais.length; doc.locais.push({ z: L.z, n: n2, nm: null, bairro: null, end: null, lat: null, lon: null }); idx.set(L.z + '|' + n2, i); }
        s[0] = i;
      }
    }
    for (const L of doc.locais) {
      const x = cat.locais[`${cd}|${L.z}|${L.n}`];
      if (x) [L.nm, L.bairro, L.end, L.lat, L.lon] = x;
    }
  }
  doc._temNomes = doc.locais.some(L => L.nm);
  doc._temBairros = doc.locais.some(L => L.bairro);
  doc._temCoords = doc.locais.some(L => L.lat != null && L.lon != null);
}
const nomeLocal = L => L.nm ? titulo(L.nm) : `Local de votação nº ${L.n} (zona ${L.z})`;
// Soma votos por bairro / local / zona / seção
function agregar(doc, E, nivel, drill) {
  const nC = E.cand.length, grupos = new Map();
  const valido = E.cand.map(c => (c.tipo === 'c' && !c.anulado) || c.tipo === 'l');
  const filtro = si => {
    for (const d of drill) {
      const [li] = doc.secoes[si];
      if (d.nivel === 'bairro' && (doc.locais[li].bairro || '—') !== d.key) return false;
      if (d.nivel === 'local' && String(li) !== d.key) return false;
      if (d.nivel === 'zona' && String(doc.secoes[si][1]) !== d.key) return false;
    }
    return true;
  };
  const chave = si => {
    const [li, z, s] = doc.secoes[si], Lc = doc.locais[li];
    if (nivel === 'bairro') return [Lc.bairro || '—', Lc.bairro ? titulo(Lc.bairro) : 'Bairro não informado', ''];
    if (nivel === 'local') return [String(li), nomeLocal(Lc), [Lc.bairro && titulo(Lc.bairro), Lc.end && titulo(Lc.end)].filter(Boolean).join(' · ')];
    if (nivel === 'zona') return [String(z), 'Zona ' + z, ''];
    return [String(si), `Zona ${z} · Seção ${s}`, nomeLocal(Lc)];
  };
  const cacheSec = new Map();
  for (let i = 0; i < E.v.length; i += 3) {
    const si = E.v[i], ci = E.v[i + 1], q = E.v[i + 2];
    let g = cacheSec.get(si);
    if (g === undefined) {
      if (!filtro(si)) { cacheSec.set(si, null); continue; }
      const [k, label, sub] = chave(si);
      g = grupos.get(k);
      if (!g) { g = { key: k, label, sub, v: new Float64Array(nC), val: 0, li: doc.secoes[si][0] }; grupos.set(k, g); }
      cacheSec.set(si, g);
    }
    if (!g) continue;
    g.v[ci] += q; if (valido[ci]) g.val += q;
  }
  const cs = E.cand.map((c, i) => i).filter(i => E.cand[i].tipo === 'c');
  for (const g of grupos.values()) { const o = cs.slice().sort((a, b) => g.v[b] - g.v[a]); g.w1 = o[0]; g.w2 = o[1]; }
  return [...grupos.values()];
}

async function modelo() {

async function modeloLive() {

async function atualizarLive(key) {

const MAPS = {};
function getMap(id) {
  if (!window.L) return null;
  const el = document.getElementById(id);
  if (MAPS[id]?.el === el) return MAPS[id];
  if (MAPS[id]) MAPS[id].map.remove();
  const map = L.map(el, { preferCanvas: true, scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
  map.setView([-5.8, -36.6], 7);

}
function mapaCandidato(doc, E, ci, c) {
  const M = getMap('mapa');

  const locs = agregar(doc, E, 'local', []).filter(g => { const L = doc.locais[g.li]; return L.lat != null && L.lon != null; });
  const acc = cssVar('--green');
  const maxV = Math.max(...locs.map(g => g.v[ci]), 1), maxSh = Math.max(...locs.map(g => g.val ? g.v[ci] / g.val : 0), 0.0001);
  for (const g of locs) {
    const L0 = doc.locais[g.li], sh = g.val ? g.v[ci] / g.val : 0;
    L.circleMarker([L0.lat, L0.lon], { radius: 4 + 18 * Math.sqrt(g.v[ci] / maxV), color: acc, weight: 1, fillColor: acc, fillOpacity: .12 + .78 * (sh / maxSh) })
      .bindTooltip(`<b>${esc(nomeLocal(L0))}</b><br>${esc(L0.bairro ? titulo(L0.bairro) : '')}<br>${esc(c.nm)}: <b>${fmt(g.v[ci])} votos</b> (${pct(sh * 100, 1)})`).addTo(M.layer);
  }
  setTimeout(() => { M.map.invalidateSize(); try { M.map.fitBounds(M.layer.getBounds(), { padding: [24, 24], maxZoom: 15 }); } catch {} }, 30);
  $('#leg').textContent = `Cada círculo é um local de votação. Maior = mais votos de ${c.nm}; mais escuro = maior fatia dos votos do local.`;
}

const LOC = {
  publicados: [],
  url: ano => `https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_${ano}.zip`,
  pares() {
    const m = new Map();
    for (const d of DS.values()) if (/^[A-Z]{2}$/.test(d.uf)) m.set(d.uf + '|' + d.ano, { uf: d.uf, ano: +d.ano });
    return [...m.values()].sort((a, b) => b.ano - a.ano || a.uf.localeCompare(b.uf));
  },
  render() {
    const t = $('#loc-table');
    if (!t) return;
    t.innerHTML = `<thead><tr><th>Ano</th><th>UF</th><th>Situação</th><th></th></tr></thead><tbody>` + LOC.pares().map(({ uf, ano }) => {
      const pub = LOC.publicados.some(x => x.uf === uf && +x.ano === ano);
      const loc = store.get('rv.locais.' + uf + '|' + ano, null);
      const sit = loc ? '<span class="chip ok">Carregado neste navegador</span>' : pub ? '<span class="chip ok">Publicado</span>' : '<span class="chip sup">Falta carregar</span>';
      return `<tr><td>${ano}</td><td>${esc(uf)}</td><td>${sit}</td><td class="n"><button class="btn sm" type="button" data-loc-auto="${ano}">${pub || loc ? 'Carregar de novo' : 'Carregar agora'}</button> <a class="btn sm" href="${LOC.url(ano)}" target="_blank" rel="noopener">Baixar do TSE</a>${loc ? ` <button class="btn sm" type="button" data-loc-export="${uf}|${ano}">Baixar arquivo para publicar</button>` : ''}</td></tr>`;
    }).join('') + '</tbody>';
  },
  status(msg, kind) { const p = $('#loc-status'); if (!p) return; p.innerHTML = msg; p.className = kind === 'err' ? 'note err' : kind === 'ok' ? 'note info' : 'muted'; },
  async auto(ano) {
    LOC.status(`Baixando o cadastro de locais de ${ano} do TSE… Pode levar alguns minutos.`);
    let blob;
    try { const r = await fetch(LOC.url(ano)); if (!r.ok) throw new Error(); blob = await r.blob(); }
    catch { return LOC.status(`O navegador não conseguiu baixar direto do TSE. Clique em <b>Baixar do TSE</b> (${ano}), espere o download terminar e solte o arquivo no quadro acima.`, 'err'); }
    await LOC.importar(blob, ano);
  },
  async importar(blob, ano) {
    const ufs = new Set(LOC.pares().filter(x => x.ano === +ano).map(x => x.uf));
    if (!ufs.size) return LOC.status(`Não há votos publicados de ${esc(ano)} para usar esses locais.`, 'err');
    try {
      const porUf = await lerLocaisZip(blob, ufs, pc => LOC.status(`Lendo o arquivo do TSE… ${pc}%`));
      let total = 0;
      for (const [uf, { locais, secoes }] of porUf) {
        const n = Object.keys(locais).length;
        total += n;
        const cat = { versao: 2, ano: +ano, uf, fonte: LOC.url(ano), gerado_em: new Date().toISOString(), n, locais, secoes };
        store.set('rv.locais.' + uf + '|' + ano, cat);
        CATALOGOS.set(uf + '|' + ano, cat);
      }
      if (!total) return LOC.status('O arquivo não tem locais dos estados usados aqui.', 'err');
      for (const d of DS.values()) if (d.doc && +d.ano === +ano) await aplicarLocais(d.doc);
      LOC.status(`Pronto: ${fmt(total)} locais de votação de ${ano} carregados. Para todos verem, clique em <b>Baixar arquivo para publicar</b> e envie o arquivo.`, 'ok');
      LOC.render();
    } catch (e) { LOC.status('Não foi possível ler o arquivo: ' + esc(e.message), 'err'); }
  },
  exportar(k) { const cat = store.get('rv.locais.' + k, null); if (cat) baixar(new Blob([JSON.stringify(cat)], { type: 'application/json' }), `${cat.uf.toLowerCase()}-${cat.ano}.json`); },
  init() {
    const drop = $('#loc-drop'), file = $('#loc-file');
    const ler = f => {
      if (!f) return;
      const ano = (f.name.match(/(20\d\d)/) || [])[1];
      if (!ano) return LOC.status('Não reconheci o ano pelo nome do arquivo. Use o arquivo do TSE sem renomear.', 'err');
      LOC.importar(f, ano);
    };
    drop.onclick = () => file.click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
    file.onchange = () => ler(file.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); ler(e.dataTransfer.files[0]); };
  },
};

/* ============================================================ cliques globais: voltar, favoritos, planilhas, atalhos */
document.addEventListener('click', async e => {
  if (e.target.closest('[data-back]')) { voltar(); return; }
  const st = e.target.closest('[data-fav]');
  if (st) { e.stopPropagation(); alternarFav(st.dataset.fav); const on = !!favs()[st.dataset.fav]; st.setAttribute('aria-pressed', on); if (ST.tela === 'favoritos') { ST.manterScroll = true; render(); } return; }
  const cr = e.target.closest('.clist .crow[data-cand]');
  if (cr && ST.tela === 'resultado') { ST.candNr = cr.dataset.cand; ST.drill = []; irPara('candidato'); return; }
  const an = e.target.closest('[data-ano]');
  if (an) { ST.ano = +an.dataset.ano; ST.turno = 1; ST.cargo = null; ST.candNr = null; ST.drill = []; salvar(); if (an.tagName === 'BUTTON') render(); return; }
  const la = e.target.closest('[data-loc-auto]');
  if (la) { LOC.auto(la.dataset.locAuto); return; }
  const lx = e.target.closest('[data-loc-export]');
  if (lx) { LOC.exportar(lx.dataset.locExport); return; }
  const b = e.target.closest('[data-exp]');
  if (!b || !EXPORTS[b.dataset.exp]) return;
  const { nome, head, rows } = EXPORTS[b.dataset.exp]();
  const arq = norm(nome).toLowerCase().replace(/ /g, '-').slice(0, 90) || 'radar-votos';
  if (b.dataset.kind === 'csv') {
    const cel = v => typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v ?? '').replace(/"/g, '""') + '"';
    baixar(new Blob(['﻿' + [head, ...rows].map(r => r.map(cel).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), arq + '.csv');
  } else {
    b.disabled = true;
    try {
      if (!window.XLSX) await new Promise((ok, err) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), 'Dados');
      XLSX.writeFile(wb, arq + '.xlsx');
    } catch { alert('Não foi possível gerar o Excel. Tente o CSV.'); }
    b.disabled = false;
  }
});
function baixar(blob, nome) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================ início */
(async function main() {
  $('#tela').innerHTML = '<div class="empty">Carregando…</div>';
  await carregarIndice();
  if (!ST.ano || (!EH_LIVE() && !anosHist().includes(+ST.ano))) ST.ano = anosHist()[0] || 2026;
  render();
})();
</script>
